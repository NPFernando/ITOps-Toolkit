[server]
fileWatcherType = "none"
runOnSave = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
# Matches the shared dark "tools" palette reused verbatim across cloudscope,
# odysseus, and hermes-workspace (bg #282c34 / fg #9cdef2 / accent #e06c75 /
# success #50fa7b / warning #f0ad4e) rather than the separate blue palette
# used by the portfolio marketing site.
base = "dark"
primaryColor = "#e06c75"
backgroundColor = "#282c34"
secondaryBackgroundColor = "#1e2228"
textColor = "#9cdef2"
borderColor = "#355a66"
linkColor = "#9cdef2"
codeBackgroundColor = "#111111"
baseRadius = "0.75rem"
font = "sans-serif"
showWidgetBorder = false
blueColor = "#61afef"
greenColor = "#50fa7b"
orangeColor = "#f0ad4e"
violetColor = "#c678dd"
grayColor = "#6b8a94"

[theme.sidebar]
primaryColor = "#e06c75"
backgroundColor = "#1e2228"
secondaryBackgroundColor = "#111111"
textColor = "#9cdef2"
borderColor = "#355a66"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
