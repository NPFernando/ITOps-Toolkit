name: QA

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python files
        run: python -m compileall app.py pages utils

      - name: Run reliability guardrail tests
        if: matrix.python-version == '3.11'
        run: >-
          python -m pytest
          tests/test_health_diagnostics_page.py
          tests/test_cache_policy.py
          tests/test_maintenance_consistency.py
          tests/test_cve_tools.py
          tests/test_totp_tools.py
          tests/test_log_ai_page.py
          tests/test_streamlit_pages.py

      - name: Run full tests
        if: matrix.python-version == '3.12'
        run: python -m pytest
